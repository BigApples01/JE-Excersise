name: Excel summary

on:
  workflow_dispatch:
  push:
    paths:
      - "je_samples_exercise.xlsx"
      - "scripts/analyze_excel.py"
      - "requirements.txt"
      - ".github/workflows/excel-summary.yml"

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Excel analysis
        run: python scripts/analyze_excel.py --input je_samples_exercise.xlsx --output-dir outputs

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: excel-summary-outputs
          path: outputs
          if-no-files-found: error
